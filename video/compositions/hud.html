  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const T0 = 6.95, END = 51.6;             // this host starts at 7.0 s of the film and leaves as the end card arrives
      const T = (abs) => +(abs - T0).toFixed(3);
      const E = fx.ENTER, X = fx.EXIT;

      // the whole table rises in with Day 1 and leaves before the end card
      tl.fromTo("#hud-wrap", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, 0);
      tl.fromTo("#hud-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: X, immediateRender: false }, END - 0.32);
      // progress: from Day 1 to the end of the game
      tl.fromTo("#hud-bar", { scaleX: 0 }, { scaleX: 1, duration: END, ease: "none" }, 0);

      // day labels
      const label = (id, from, to) => {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: E }, T(from));
        if (to) tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: X, immediateRender: false }, T(to) - 0.3);
      };
      label("#hud-d1", T0, 27.6);
      label("#hud-d2", 27.6, 41.75);
      label("#hud-d3", 41.75, null);

      // rings: who is talking (say) or thinking (think) on screen right now; scenes overlap 0.25 s, so a ring ends as the next begins
      const ring = (who, kind, from, to) => {
        const r = `#hud-${who} .ring.r-${kind}`;
        tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: E }, T(from));
        tl.fromTo(r, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: X, immediateRender: false }, T(to) - 0.25);
      };
      // the disc grows while its owner holds the screen (one span per run of rings, so scale tweens never overlap)
      const lift = (who, from, to) => {
        tl.fromTo(`#hud-${who}`, { scale: 1 }, { scale: 1.08, duration: 0.25, ease: E }, T(from));
        tl.fromTo(`#hud-${who}`, { scale: 1.08 }, { scale: 1, duration: 0.25, ease: X, immediateRender: false }, T(to) - 0.25);
      };
      ring("Luna", "say", 6.95, 10.6);         lift("Luna", 6.95, 10.6);
      ring("Opus", "think", 10.7, 17.0);
      ring("Opus", "say", 17.0, 23.0);         lift("Opus", 10.7, 23.0);
      ring("Opus", "think", 30.55, 36.55);
      ring("Opus", "say", 36.55, 41.75);       lift("Opus", 30.55, 41.75);
      ring("Opus", "ghost", 45.85, 52.45);
      ring("Haiku", "think", 53.25, 56.55);    lift("Haiku", 53.25, 56.55);

      // out of the game: the portrait goes grey; a turned card shows its role badge
      const out = (who, at, badge) => {
        tl.fromTo(`#hud-${who} img.dead`, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, T(at));
        tl.fromTo(`#hud-${who} img`, { scale: 1 }, { scale: 0.92, duration: 0.9, ease: "sine.inOut" }, T(at));
        tl.fromTo(`#hud-${who} ~ b`, { opacity: 1 }, { opacity: 0.45, duration: 0.9, ease: "sine.inOut" }, T(at));
        if (badge) tl.fromTo(`#hud-${who} .badge`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, T(at) + 0.5);
      };
      // a night kill: grey face and a plate under the name for about a second and a half
      const night = (who, at) => {
        out(who, at, false);
        tl.fromTo(`#kn-${who}`, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25, ease: E }, T(at));
        tl.fromTo(`#kn-${who}`, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: X, immediateRender: false }, T(at) + 1.6);
      };
      out("Luna", 24.1, true);     // voted out, card turned: officer
      night("Sol", 27.6);          // killed in the night before Day 2, card stays face down
      out("Opus", 37.7, true);     // voted out, card turned: killer
      out("Gemma", 42.8, true);    // voted out after the tie, card turned: doctor
      night("Terra", 52.45);       // killed in the night before the end
      // the quiet partner: his role shows only when the game is over
      tl.fromTo("#hud-Haiku .badge", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, T(56.8));

      window.__timelines["hud"] = tl;
    })();
  </script>
