# Builds the viewer and publishes it, with the three newest evenings, as a static site on GitHub Pages.
# Runs only while the repository is public. Pages must be set to "GitHub Actions" (Settings > Pages > Source).
name: Publish the viewer

on:
  push:
    branches: [main]
    paths: ['palermo/ui/**', 'palermo/games/**', 'palermo/avatars/**', 'palermo/art/**', 'palermo/view.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: palermo/ui/package-lock.json
      - name: Build the viewer
        working-directory: palermo/ui
        run: npm ci && npm test && npm run build
      - name: Export the static site
        working-directory: palermo
        run: python3 view.py --export "$RUNNER_TEMP/site" --tags fun9,sun15,r7a
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
